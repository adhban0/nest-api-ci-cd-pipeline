name: gitleaks
on:
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
  # push:
  workflow_dispatch:
  schedule:
    - cron: "18 1 * * 0" # run once a day at 4 AM
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: '@adhban0'
