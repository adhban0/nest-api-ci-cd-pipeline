name: Continuous Integration

on:
  # pull_request:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - '.github/workflows/**'
    workflow_dispatch:
jobs:
  Test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      
      # - name: Run Tests
      #   run: npm test
      
      - name: Build
        run: npm run build
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_PASSWORD: postgres
          DB_PORT: 5432
          DB_USER: postgres
      - name: Migrate
        run: node migrate.js
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: test_db
          DB_PASSWORD: postgres
          DB_PORT: 5432
          DB_USER: postgres  # Push to Docker Hub and Deploy (Main branch only)
